# 微博监控: 主驱动为 cron-job.org 每 4 分钟通过 workflow_dispatch 触发
# GitHub schedule 每 2 小时一次, 仅作兜底(外部调度失效时仍能检查)
# 也可在 Actions 页面手动运行 workflow 做测试
name: weibo-monitor

on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch: # cron-job.org 定时触发 + Actions 页面手动触发

permissions:
  contents: write # 允许回写 state.json(断点续传的关键)

concurrency:
  group: weibo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查并推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: python weibo_monitor.py

      - name: 回写 state.json
        if: always() # 推送失败也要保存已推送进度, 否则下次会重复推送
        run: |
          git config user.name "weibo-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "state 无变化"
          else
            git commit -m "chore: update weibo state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              echo "推送冲突, 第 $i 次重试..."
              sleep 5
            done
          fi